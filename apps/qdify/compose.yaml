name: qdify

# MiniStack, which holds the tasks. Start it alone with `docker compose -f ministack.yaml up -d`.
include:
  - ministack.yaml

services:
  qdify:
    build: .
    image: alice/qdify:${QDIFY_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    environment:
      QDIFY_API_TOKEN: ${QDIFY_API_TOKEN:?set QDIFY_API_TOKEN in apps/qdify/.env}
      QDIFY_DYNAMODB_ENDPOINT: http://ministack:4566
    ports:
      - '${QDIFY_BIND:-127.0.0.1}:${QDIFY_PUBLISH_PORT:-8787}:8787'
    depends_on:
      ministack:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
