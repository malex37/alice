id: qdify-api
language: typescript
tags: [qdify-pnpm]
layer: application
stack: backend
toolchains:
  default: system
dependsOn: [qdify-shared]
tasks:
  # Starts MiniStack if it isn't up, then runs the API in a container with src mounted and
  # hot reload on. See scripts/dev.sh and ../dev.yaml.
  dev:
    command: bash scripts/dev.sh
    deps: ['^:build']
    preset: server
  # The store tests against MiniStack, in a throwaway table. `test` covers the rest.
  test-dynamodb:
    command: pnpm exec vitest run src/store.test.ts
    deps: ['^:build']
    env:
      QDIFY_TEST_DYNAMODB_ENDPOINT: 'http://127.0.0.1:4566'
    options:
      cache: false
      runInCI: false
