# qdify's own workspace, so the repo root stays language-neutral.
packages:
  - 'shared'
  - 'api'
  - 'web'

# Tool versions shared by the packages (referenced as "catalog:").
catalog:
  '@types/node': ^24.19.2
  oxlint: ^1.94.0
  typescript: ~5.9.3
  vitest: ^5.1.1

onlyBuiltDependencies:
  - esbuild
